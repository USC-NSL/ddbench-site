<!doctype html>
<!-- Source of assets/og-image.png, the picture shown when the site's link is shared. Regenerate from the site folder:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 --screenshot=assets/og-image.png "file://$PWD/scripts/og-image.html" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DDBench preview image</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
  <style>
    html, body { margin: 0; }
    body {
      display: flex; flex-direction: column; box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px 68px;
      background: #1c5cab; color: #fff; font-family: "IBM Plex Sans", sans-serif;
    }
    .brand { display: flex; align-items: center; gap: 28px; font-size: 104px; font-weight: 600; letter-spacing: -0.015em; line-height: 1; }

    p { margin: 36px 0 0; color: #dbe8f8; font-size: 46px; line-height: 1.22; }

    dl div { display: flex; align-items: baseline; gap: 16px; }
    dt { order: 2; color: #dbe8f8; font-size: 38px; }
    dd { margin: 0; font-size: 84px; font-weight: 600; line-height: 1; }

  <div class="brand">
    <svg viewBox="0 0 32 32" width="112" height="112" aria-hidden="true">
      <path d="M16 7 6.5 24h19z" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="16" cy="7" r="4" fill="#fff"/>
      <circle cx="6.5" cy="24" r="4" fill="#fff"/>
      <circle cx="25.5" cy="24" r="4" fill="#ffb48f"/>
    </svg>
    DDBench
  </div>
  <p>A benchmark for agentic debugging<br>on distributed systems</p>
  <dl>
    <div><dt>bugs</dt><dd>60</dd></div>
